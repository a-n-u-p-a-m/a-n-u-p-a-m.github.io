<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q4 – Stoplight Game (Nash Equilibrium Simulation)</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet">

<style>
body {
  font-family:'Quicksand',sans-serif;
  background:linear-gradient(135deg,#84fab0,#8fd3f4);
  min-height:100vh; margin:0;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  text-align:center; color:#333;
}
h1 { margin-top:25px; color:#003d4d; text-shadow:1px 1px 3px rgba(0,0,0,0.2); }
button {
  font-family:'Quicksand',sans-serif; font-size:18px;
  padding:10px 20px; margin:10px;
  border:none; border-radius:8px;
  background:#0077cc; color:#fff; cursor:pointer;
  transition:background 0.2s;
}
button:hover { background:#005fa3; }
#resultBox {
  margin-top:20px; background:rgba(255,255,255,0.9);
  padding:20px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1);
  width:350px;
}
.scoreBoard {
  margin-top:20px; background:#fff;
  border-radius:10px; padding:15px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  width:280px;
}
#log {
  margin-top:15px; text-align:left; max-height:200px; overflow-y:auto;
  background:rgba(255,255,255,0.8); border-radius:10px; padding:10px; font-size:14px;
}
footer {
  margin-top:auto; font-size:14px; color:#004466; padding:15px;
}
</style>
</head>
<body>

<h1>🚦 Stoplight Game – Nash Equilibrium Simulator</h1>

<!-- Human player controls -->
<div>
  <button onclick="playRound('Go')">Go 🏎️</button>
  <button onclick="playRound('Stop')">Stop 🛑</button>
  <button onclick="autoSimulate()">▶ Auto Simulate 20 Rounds</button>
</div>

<!-- Round result box -->
<div id="resultBox">
  <h2>Round Result</h2>
  <p id="roundOutcome">Make your move or run simulation.</p>
</div>

<!-- Scoreboard -->
<div class="scoreBoard">
  <p><b>Human Score:</b> <span id="humanScore">0</span></p>
  <p><b>Computer Score:</b> <span id="computerScore">0</span></p>
</div>

<!-- Simulation log -->
<div id="log"></div>

<footer>
Q4 • Software Systems Development • IIIT Hyderabad
</footer>

<script>
// Initialize total scores
let humanScore=0, computerScore=0;

// Game choices
const choices=["Go","Stop"];

// Payoff matrix for (humanChoice, computerChoice)
const payoff={
  "Go":{"Go":[0,0],"Stop":[3,1]},
  "Stop":{"Go":[1,3],"Stop":[2,2]}
};

// --- MAIN FUNCTION: Play single round when human chooses ---
function playRound(humanChoice){
  const computerChoice=choices[Math.floor(Math.random()*choices.length)];
  const [hPay,cPay]=payoff[humanChoice][computerChoice];
  humanScore+=hPay; computerScore+=cPay;
  updateUI(humanChoice,computerChoice,hPay,cPay);
}

// --- UI UPDATE FUNCTION ---
function updateUI(human,comp,hPay,cPay){
  document.getElementById("roundOutcome").innerHTML=
    `<b>You:</b> ${human} | <b>Computer:</b> ${comp}<br>
     Payoff = (${hPay}, ${cPay})<br><i>${describe(human,comp)}</i>`;
  document.getElementById("humanScore").textContent=humanScore;
  document.getElementById("computerScore").textContent=computerScore;
}

// --- EXPLANATION OF RESULT ---
function describe(h,c){
  if(h==="Go"&&c==="Go")return"Both crashed! 🚧 Nash equilibrium avoided.";
  if(h==="Go"&&c==="Stop")return"You raced ahead while computer played safe!";
  if(h==="Stop"&&c==="Go")return"Computer took the risk and won this round.";
  if(h==="Stop"&&c==="Stop")return"Both stayed cautious – mutual Nash equilibrium.";
}

// --- AUTO SIMULATION FUNCTION ---
function autoSimulate(){
  humanScore=0; computerScore=0;
  document.getElementById("log").innerHTML="";
  let rounds=20;
  const delay=400; // ms between rounds

  let i=0;
  const interval=setInterval(()=>{
    if(i>=rounds){clearInterval(interval); showSummary(); return;}
    const humanChoice=choices[Math.floor(Math.random()*choices.length)];
    const compChoice=choices[Math.floor(Math.random()*choices.length)];
    const [hPay,cPay]=payoff[humanChoice][compChoice];
    humanScore+=hPay; computerScore+=cPay;

    // Log each round
    document.getElementById("log").innerHTML+=
      `<b>Round ${i+1}:</b> ${humanChoice} / ${compChoice} → (${hPay},${cPay})<br>`;

    i++;
    updateUI(humanChoice,compChoice,hPay,cPay);
  },delay);
}

// --- FINAL SUMMARY ---
function showSummary(){
  const h=document.getElementById("humanScore").textContent;
  const c=document.getElementById("computerScore").textContent;
  document.getElementById("log").innerHTML+=
    `<br><b>Simulation Complete!</b><br>Final Payoffs: Human=${h}, Computer=${c}<br>
     <i>Repeated play tends to favor mutual Stop/Stop outcomes (≈ Nash Equilibrium).</i>`;
}
</script>

</body>
</html>
